services:
- type: web
  name: salevora
  runtime: docker
  region: oregon
  plan: free
  autoDeploy: true
  healthCheckPath: /
  envVars:
    - key: PYTHONUNBUFFERED
      value: "1"
    - key: PORT
      value: "8000"
    - key: LOG_LEVEL
      value: INFO
    - key: ENVIRONMENT
      value: production
